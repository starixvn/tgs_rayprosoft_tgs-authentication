apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "authentication.fullname" . }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "Server=172.18.0.5;Database=tgs;User Id=tgs;Password=1qaz2wsx!@"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
